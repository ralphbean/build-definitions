# task/oci-copy-oci-ta/0.2/tests/data/mock-http-server/http-server-deployment.yaml
# Deploys a simple Nginx server that can serve files over HTTP and HTTPS.
# For HTTPS, it uses a self-signed certificate generated on-the-fly or provided.
# Files are mounted from the 'http-server-files-cm' ConfigMap.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-server
  # namespace: oci-copy-ta-0-2-testns # Will be deployed to the test namespace
  labels:
    app: http-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-server
  template:
    metadata:
      labels:
        app: http-server
    spec:
      containers:
      - name: nginx
        image: nginx:1.25 # Using a standard nginx image
        ports:
        - containerPort: 8080 # HTTP
        # - containerPort: 8443 # HTTPS - Nginx config for SSL needs to be added
        volumeMounts:
        - name: http-files
          mountPath: /usr/share/nginx/html # Default Nginx serve directory
        # - name: nginx-config # For custom nginx.conf to enable SSL
        #   mountPath: /etc/nginx/conf.d/default.conf
        #   subPath: default.conf
        # - name: tls-certs # For SSL certificates
        #   mountPath: /etc/nginx/ssl
        #   readOnly: true
      volumes:
      - name: http-files
        configMap:
          name: http-server-files-cm # Mounts files from the ConfigMap created earlier
      # - name: nginx-config
      #   configMap:
      #     name: nginx-ssl-conf # A separate ConfigMap containing nginx.conf for SSL
      #     items:
      #     - key: default.conf
      #       path: default.conf
      # - name: tls-certs
      #   secret:
      #     secretName: http-server-tls # A Secret containing tls.crt and tls.key
---
apiVersion: v1
kind: Service
metadata:
  name: http-server-service
  # namespace: oci-copy-ta-0-2-testns # Will be deployed to the test namespace
  labels:
    app: http-server
spec:
  ports:
  - name: http
    port: 8080 # Service port for HTTP
    targetPort: 8080
  # - name: https
  #   port: 8443 # Service port for HTTPS
  #   targetPort: 8443
  selector:
    app: http-server
  type: ClusterIP # Only needs to be cluster-internal for tests
